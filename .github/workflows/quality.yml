name: Quality

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

# URLs dummy: prisma generate lê o schema sem conectar; satisfaz configs que
# validam a existência das envs. Nenhum banco real é tocado.
env:
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
  DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Prisma generate (if used)
        run: if [ -f prisma/schema.prisma ]; then pnpm exec prisma generate; fi
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint (strict)
        run: pnpm run lint:strict

  secrets:
    name: secrets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan PR diff for secrets (gitleaks)
        env:
          BASE: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          VER=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o gl.tgz
          tar -xzf gl.tgz gitleaks
          chmod +x gitleaks
          git fetch --quiet origin "$BASE" --depth=200
          ./gitleaks detect --source . --redact --no-banner \
            --log-opts="origin/${BASE}..${HEAD_SHA}"
