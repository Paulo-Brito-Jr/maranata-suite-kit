name: Quality

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

# URLs dummy: prisma generate lê o schema sem conectar; satisfaz configs que
# validam a existência das envs. Nenhum banco real é tocado.
env:
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
  DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"

jobs:
  quality_matrix:
    name: quality (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.3
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Prisma generate (if used)
        run: if [ -f prisma/schema.prisma ]; then pnpm exec prisma generate; fi
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build and verify committed dist
        run: |
          rm -rf -- dist
          pnpm run build
          if [ -n "$(git status --porcelain --untracked-files=all -- dist)" ]; then
            git status --short --untracked-files=all -- dist
            exit 1
          fi
      - name: Tutorial editorial manifests
        run: pnpm run test:tutorial-editorial
      - name: Tutorial resolver
        run: node --test scripts/tutorial.test.mjs
      - name: Pastoral parse (claim `funcoes`)
        run: node --test scripts/pastoral.test.mjs
      - name: Serviço parse (claim `servico`)
        run: node --test scripts/servico.test.mjs
      - name: Grupos parse (detalhe de escopo por grupo)
        run: node --test scripts/grupos.test.mjs
      - name: Tutorial package self-reference
        run: >-
          node --input-type=module -e "const mod = await
          import('@paulo-brito-jr/maranata-suite-kit/tutorial'); if (typeof
          mod.resolveTutorialVisibility !== 'function') throw new
          Error('tutorial export ausente')"
      - name: Smoke
        run: pnpm run smoke

  quality:
    name: quality
    if: always()
    needs: quality_matrix
    runs-on: ubuntu-latest
    steps:
      - name: Require every supported Node version
        env:
          MATRIX_RESULT: ${{ needs.quality_matrix.result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            exit 1
          fi

  secrets:
    name: secrets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan PR diff for secrets (gitleaks)
        env:
          BASE: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          VER=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o gl.tgz
          tar -xzf gl.tgz gitleaks
          chmod +x gitleaks
          git fetch --quiet origin "$BASE" --depth=200
          ./gitleaks detect --source . --redact --no-banner \
            --log-opts="origin/${BASE}..${HEAD_SHA}"
