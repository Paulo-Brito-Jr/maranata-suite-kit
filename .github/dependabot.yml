# Dependabot só com SECURITY updates (frota Brito/Skynet, 08/11/2026): PR de versão é do Renovate
# (renovate.json → preset github>Paulo-Brito-Jr/skynet//renovate-presets/frota). open-pull-requests-limit: 0 desliga
# os version updates do ecossistema e não afeta os security updates. Runbook: skynet/docs/runbooks/fila-de-prs.md
version: 2
updates:
  - package-ecosystem: "npm"
    open-pull-requests-limit: 0
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Cooldown de 7 dias (regra da casa): versao com menos de 7 dias de publicada nao vira PR (so version updates).
    cooldown:
      default-days: 7
    labels: ["dependencies"]
    # Prisma 7 e uma migracao estrutural (schema.prisma -> prisma.config.ts),
    # nao um bump: fica fora ate o projeto de migracao dedicado.
    ignore:
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/*"
        update-types: ["version-update:semver-major"]
    # Grupo semanal SO com minor/patch (major de toolchain quebra em serie —
    # ex.: eslint 10 x eslint-plugin-react). Majors chegam como PRs
    # individuais, avaliados um a um (limit 3 controla o fluxo).
    groups:
      todas-as-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    open-pull-requests-limit: 0
    directory: "/"
    schedule:
      interval: "monthly"
    # Cooldown de 7 dias (regra da casa): versao com menos de 7 dias de publicada nao vira PR (so version updates).
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
